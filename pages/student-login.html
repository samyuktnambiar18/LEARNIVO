<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Setup — LEARNIVO</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/onboarding.css">
  <link rel="stylesheet" href="../css/profile-setup-redesign.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="profile-page-bg">

  <!-- Atmospheric Background Glows -->
  <div class="bg-glow top-right"></div>
  <div class="bg-glow bottom-left"></div>

  <!-- Header -->
  <header class="profile-header">
    <a href="../index.html" class="profile-brand-logo">
      <img src="../assets/images/logo.png" alt="LEARNIVO Logo" onerror="this.src='../assets/images/logo.jpg'">
      <span>LEARNIVO</span>
    </a>
    <div class="header-right-auth">
      <span>Already have an account?</span>
      <a href="student-dashboard.html" class="btn-login-outline">Log In</a>
    </div>
  </header>

  <!-- Main Viewport Container (Non-scrollable 100vh Desktop Layout) -->
  <main class="profile-viewport-container">

    <div class="profile-setup-composition">

      <!-- LEFT: Profile Setup Content & Card (45%) -->
      <div class="profile-left-column">
        
        <div class="welcome-badge-pill">
          <span>✦ WELCOME TO LEARNIVO</span>
        </div>

        <h1 class="profile-main-title">Let’s Get Started 👋</h1>
        <p class="profile-main-desc">Tell us a bit about yourself so we can personalize your learning experience.</p>

        <!-- White Profile Setup Card -->
        <div class="profile-card-wrapper">
          
          <!-- Step Progress Indicator Bar -->
          <div class="profile-step-indicator">
            <div class="step-pill active">
              <span class="step-num">1</span>
              <span class="step-label">Profile</span>
            </div>
            <span class="step-divider">→</span>
            <div class="step-pill muted">
              <span class="step-num">2</span>
              <span class="step-label">Courses</span>
            </div>
            <span class="step-divider">→</span>
            <div class="step-pill muted">
              <span class="step-num">3</span>
              <span class="step-label">Dashboard</span>
            </div>
          </div>

          <form id="profile-setup-form" onsubmit="handleProfileSubmit(event)">
            
            <!-- Your Name -->
            <div class="form-field-group">
              <label for="student-name">Your Name</label>
              <div class="input-icon-box">
                <span class="icon-prefix">👤</span>
                <input type="text" id="student-name" class="styled-input-field" placeholder="Enter your name" value="Alex Morgan" required>
              </div>
            </div>

            <!-- Your Grade -->
            <div class="form-field-group">
              <label for="student-grade">Your Grade</label>
              <div class="input-icon-box">
                <span class="icon-prefix">🎓</span>
                <select id="student-grade" class="styled-select-field" required>
                  <option value="" disabled>Select your grade</option>
                  <option value="Grade 9">Grade 9 (High School)</option>
                  <option value="Grade 10">Grade 10 (High School)</option>
                  <option value="Grade 11" selected>Grade 11 (High School)</option>
                  <option value="Grade 12">Grade 12 (Senior High)</option>
                  <option value="College / University">College / University</option>
                </select>
              </div>
            </div>

            <!-- Choose an Avatar (3x2 Arrangement) -->
            <div class="avatar-field-group">
              <div class="avatar-label-box">
                <label>Choose an avatar</label>
                <span class="avatar-sublabel">Pick a character that represents you!</span>
              </div>

              <!-- 6 Avatars rendered dynamically in 3x2 Grid -->
              <div class="avatar-grid-3x2" id="avatar-grid-container">
                <!-- Rendered dynamically by JS -->
              </div>
            </div>

            <!-- Continue Button -->
            <button type="submit" class="btn-continue-gradient">
              <span>Continue →</span>
            </button>
          </form>

          <div class="profile-card-footer">
            You can change these details later in Settings.
          </div>
        </div>

      </div>

      <!-- RIGHT: Large Integrated LEARNIVO Educational Workspace Scene (No Bounding Card) -->
      <div class="environment-visual-wrapper">
        <div class="environment-scene-box">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" height="auto" class="learning-workspace-svg">
            <defs>
              <!-- Soft Sunlight Stream Gradient -->
              <linearGradient id="sunbeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFEACC" stop-opacity="0.5" />
                <stop offset="65%" stop-color="#FFDFB3" stop-opacity="0.18" />
                <stop offset="100%" stop-color="#FFF0D6" stop-opacity="0" />
              </linearGradient>

              <!-- Sunrise/Sunset Window View Gradient -->
              <linearGradient id="skyWindowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FFE3D1" />
                <stop offset="45%" stop-color="#F8C6DB" />
                <stop offset="100%" stop-color="#D7BBEF" />
              </linearGradient>

              <!-- Distant Soft Blurred Scenery -->
              <linearGradient id="distantHillsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#BA9FE6" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#9974D0" stop-opacity="0.8" />
              </linearGradient>

              <!-- Wooden/Neutral Desk Gradient -->
              <linearGradient id="deskTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#EFE6DE" />
                <stop offset="50%" stop-color="#E4D7CA" />
                <stop offset="100%" stop-color="#D7C7B7" />
              </linearGradient>

              <linearGradient id="deskEdgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#C7B6A4" />
                <stop offset="100%" stop-color="#B4A290" />
              </linearGradient>

              <!-- Desk Bottom Ambient Shadow -->
              <linearGradient id="deskBottomShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#3E2B68" stop-opacity="0.1" />
                <stop offset="100%" stop-color="#3E2B68" stop-opacity="0" />
              </linearGradient>

              <!-- Lamp Cone Light -->
              <radialGradient id="lampLightCone" cx="50%" cy="0%" r="90%">
                <stop offset="0%" stop-color="#FFF6E5" stop-opacity="0.6" />
                <stop offset="60%" stop-color="#FFECC2" stop-opacity="0.18" />
                <stop offset="100%" stop-color="#FFE2A3" stop-opacity="0" />
              </radialGradient>

              <!-- Book Spine Gradients -->
              <linearGradient id="bookViolet" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#7C58E3" />
                <stop offset="100%" stop-color="#9675F4" />
              </linearGradient>
              <linearGradient id="bookPeach" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#E87A64" />
                <stop offset="100%" stop-color="#F49784" />
              </linearGradient>
              <linearGradient id="bookSage" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#55B27B" />
                <stop offset="100%" stop-color="#76CBA8" />
              </linearGradient>

              <!-- Tablet Body Gradient -->
              <linearGradient id="tabletBody" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2D274E" />
                <stop offset="100%" stop-color="#1A1638" />
              </linearGradient>

              <!-- Plant Leaf Gradient -->
              <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#72D080" />
                <stop offset="100%" stop-color="#3B924A" />
              </linearGradient>

              <!-- Soft Drop Shadows -->
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3E2B68" flood-opacity="0.1" />
              </filter>
              <filter id="tabletShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="3" dy="10" stdDeviation="10" flood-color="#1A1638" flood-opacity="0.18" />
              </filter>
              <filter id="windowBlur" x="-10%" y="-10%" width="120%" height="120%">
                <feGaussianBlur stdDeviation="1.5" />
              </filter>
            </defs>

            <!-- NO outer card rect! Scene elements integrate directly into page background -->

            <!-- 1. Arched Window in Upper Right Background -->
            <g class="background-window-group" transform="translate(460, 15)">
              <!-- Outer Arch Frame -->

            <!-- 5. Small Potted Green Plant (Beside Window / Desk Back Right) -->
            <g class="plant-group" filter="url(#softShadow)" transform="translate(400, 240)">
              <!-- Ceramic Pot -->

              <ellipse cx="50" cy="55" rx="35" ry="9" fill="#E6D6CE" />

            <!-- 6. Pencil Holder with Pencils (Middle Desk) -->

              <!-- Cup -->
              <rect x="8" y="30" width="38" height="52" rx="7" fill="#EFE9F8" />

              <line x1="27" y1="32" x2="27" y2="3" stroke="#7C58E3" stroke-width="4.5" stroke-linecap="round" />
              <line x1="37" y1="32" x2="40" y2="10" stroke="#55B27B" stroke-width="4.5" stroke-linecap="round" />
            </g>

            <!-- 7. Stacked Educational Textbooks (Left Desk Surface) -->
            <g class="stacked-books-group" filter="url(#softShadow)" transform="translate(70, 315)">
              <!-- Book 1 (Bottom - Violet) -->
              <rect x="0" y="48" width="165" height="25" rx="4" fill="url(#bookViolet)" />
              <rect x="159" y="50" width="6" height="21" fill="#FAF7FF" />
              <!-- Book 2 (Middle - Peach Coral) -->
              <rect x="10" y="26" width="152" height="23" rx="4" fill="url(#bookPeach)" />
              <rect x="156" y="28" width="6" height="19" fill="#FFF5F2" />
              <!-- Book 3 (Top - Sage Green) -->
              <rect x="20" y="6" width="136" height="21" rx="4" fill="url(#bookSage)" />

            <!-- 8. Open Notebook & Pen (Front Left Desk) -->

              <!-- Sleek Pen Resting on Notebook -->
              <line x1="125" y1="6" x2="145" y2="70" stroke="#6D3FEA" stroke-width="4" stroke-linecap="round" />
              <line x1="125" y1="6" x2="127" y2="13" stroke="#FFD700" stroke-width="4" stroke-linecap="round" />
            </g>

            <!-- 9. Modern Tablet ON the Desk displaying LEARNIVO Dashboard -->
            <g class="tablet-device-group" filter="url(#tabletShadow)" transform="translate(295, 260)">
              <!-- Tablet Frame -->
              <rect x="0" y="0" width="345" height="225" rx="18" fill="url(#tabletBody)" stroke="#43396F" stroke-width="2.5" />

                <!-- Screen Header Bar -->

                  <rect x="6" y="10" width="64" height="20" rx="5" fill="#6D3FEA" />

  <script src="../js/supabase-config.js"></script>
  <script src="../js/profile.js"></script>

  <script>
    let selectedAvatarPath = '../assets/images/avatar-1.png';

    document.addEventListener('DOMContentLoaded', () => {
      const student = getStoredStudent();
      // Reset completedOnboarding to ensure starting on student-login.html runs a fresh login flow
      student.completedOnboarding = false;
      saveStoredStudent(student);

      if (student.name) document.getElementById('student-name').value = student.name;
      if (student.grade) document.getElementById('student-grade').value = student.grade;
      if (student.avatar) selectedAvatarPath = student.avatar;

      renderAvatarGrid();
    });

    function renderAvatarGrid() {
      const container = document.getElementById('avatar-grid-container');
      if (!container) return;

      container.innerHTML = DEFAULT_AVATARS.map(av => {
        const isSel = selectedAvatarPath.includes(`avatar-${av.id}.png`);
        return `
          <div class="avatar-item-circle ${isSel ? 'selected' : ''}" onclick="selectAvatar('${av.src}', this)">
            <img src="${av.src}" alt="${av.alt}">
          </div>
        `;
      }).join('');
    }

    function selectAvatar(src, elem) {
      selectedAvatarPath = src;
      document.querySelectorAll('.avatar-item-circle').forEach(el => el.classList.remove('selected'));
      elem.classList.add('selected');
    }

    function handleProfileSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('student-name').value.trim();
      const grade = document.getElementById('student-grade').value;

      if (!name) {
        showToast('Please enter your name', 'error');
        return;
      }

      const currentProfile = getStoredStudent();
      currentProfile.name = name;
      currentProfile.grade = grade;
      currentProfile.avatar = selectedAvatarPath;

      saveStoredStudent(currentProfile);

      showToast(`Welcome ${name}! Proceeding to Course Setup...`, 'success');
      setTimeout(() => {
        window.location.href = 'onboarding.html';
      }, 600);
    }
  </script>
</body>
</html>
