<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login — LEARNIVO</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="auth-page-container">
    <div class="auth-panel-visual" style="background: var(--bg-purple-light);">
      <a href="../index.html" class="logo-placeholder">LEARNIVO</a>

      <div class="auth-visual-content">
        <h2>Educator & Mentor Portal</h2>
        <p>Access student diagnostic requests, review mistake briefs, and schedule 1-on-1 mentorship meetings.</p>
      </div>

      <div style="font-size: 0.85rem; color: var(--secondary-text);">
        &copy; 2026 LEARNIVO Educator Portal
      </div>
    </div>

    <div class="auth-panel-form">
      <div class="auth-form-box">
        <a href="../index.html" style="font-size: 0.9rem; margin-bottom: 2rem; display: inline-block;">← Back to Home</a>

        <div class="auth-header">
          <h2>Teacher Login</h2>
          <p>Access mentor dashboard & student diagnostic summary drawers.</p>
        </div>

        <form id="teacher-login-form">
          <div class="form-group">
            <label class="form-label" for="teacher-email">Mentor Email</label>
            <input type="email" id="teacher-email" class="form-control" placeholder="eleanor.vance@learnivo.edu" value="eleanor.vance@learnivo.edu" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="teacher-password">Password</label>
            <input type="password" id="teacher-password" class="form-control" placeholder="••••••••" value="teacher123" required>
          </div>

          <button type="submit" class="btn btn-primary auth-btn-full" style="background: var(--deep-purple);">LOGIN TO TEACHER DASHBOARD →</button>
        </form>

        <div class="auth-switch-link">
          Are you a student? <a href="student-login.html">STUDENT LOGIN →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
